<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>«Язык души» — «Дорога историй»</title>

<style>
:root{
  --gold:#b98a32;
  --blue:#315469;
  --line:#e6d8bd;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:linear-gradient(#fffdf8,#f1e7d6);
  overflow-x:hidden;
}

.page{
  max-width:1150px;
  margin:auto;
  padding:18px;
}

.visual{
  position:relative;
  max-width:1145px;
  margin:auto;
}

.visual img{
  display:block;
  width:100%;
  height:auto;
  border:1px solid var(--line);
  border-radius:22px;
}

/* Реальная кнопка «ВОЙТИ В THE ROAD OF STORIES»,
   расположенная поверх кнопки на изображении */
.enter-link{
  position:absolute;
  left:6%;
  bottom:3.8%;
  width:32%;
  height:6.2%;
  display:block;
  border-radius:30px;
  cursor:pointer;
  z-index:2;
}

.enter-link:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:5px;
}

/* Переход к карте */
.transition-layer{
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 55%,
      rgba(255,249,223,.965),
      rgba(253,247,235,.985) 38%,
      rgba(238,229,208,.99)
    );
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .55s ease,visibility .55s ease;
}

.transition-layer::before{
  content:"";
  position:absolute;
  inset:-15%;
  background:
    radial-gradient(
      circle at 48% 55%,
      rgba(255,255,240,0) 0 20%,
      rgba(255,255,240,.28) 42%,
      rgba(255,255,240,0) 70%
    );
  transform:scale(.7);
  opacity:0;
}

.transition-layer.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.transition-layer.show::before{
  animation:lightPulse 1.75s ease-out forwards;
}

.transition-inner{
  text-align:center;
  transform:translateY(16px) scale(.97);
  opacity:0;
  transition:transform .7s ease,opacity .5s ease;
  position:relative;
  z-index:1;
}

.transition-layer.show .transition-inner{
  transform:translateY(0) scale(1);
  opacity:1;
}

.transition-road{
  width:min(230px,36vw);
  margin:0 auto 20px;
  filter:drop-shadow(0 8px 20px rgba(126,91,22,.12));
}

.transition-road svg{
  overflow:visible;
}

.transition-road path:first-child{
  stroke-dasharray:440;
  stroke-dashoffset:440;
}

.transition-layer.show .transition-road path:first-child{
  animation:drawRoad 1.35s .05s ease-out forwards;
}

.transition-road path:last-child{
  stroke-dasharray:4 11;
  stroke-dashoffset:0;
  opacity:.9;
}

.transition-layer.show .transition-road path:last-child{
  animation:moveDashes .9s .25s linear infinite;
}

.transition-title{
  margin:0;
  color:#6e4b18;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,4vw,46px);
  letter-spacing:.04em;
}

.transition-sub{
  margin:10px 0 0;
  color:var(--blue);
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
}

@keyframes drawRoad{
  to{
    stroke-dashoffset:0;
    filter:drop-shadow(0 7px 24px rgba(185,138,50,.34));
  }
}

@keyframes moveDashes{
  to{
    stroke-dashoffset:-15;
  }
}

@keyframes lightPulse{
  0%{
    opacity:0;
    transform:scale(.7);
  }
  38%{
    opacity:1;
  }
  100%{
    opacity:.35;
    transform:scale(1.15);
  }
}

@media(max-width:620px){
  .page{
    padding:8px;
  }

  .visual img{
    border-radius:16px;
  }

  .enter-link{
    left:6%;
    bottom:3.8%;
    width:32%;
    height:6.2%;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="page">
  <main class="visual">

    <img
      src="from_story_to_voice.png"
      alt="Язык души — Дорога историй. From Story to Voice"
    >

    <!-- Единственная активная зона на изображении:
         кнопка «ВОЙТИ В THE ROAD OF STORIES» -->
    <a
      class="enter-link"
      href="road.html"
      aria-label="Войти в The Road of Stories"
      data-map-link
    ></a>

  </main>
</div>

<!-- Анимация перехода к карте -->
<div class="transition-layer" id="transitionLayer" aria-hidden="true">

  <div class="transition-inner">

    <div class="transition-road" aria-hidden="true">
      <svg
        viewBox="0 0 240 190"
        width="100%"
        height="auto"
        role="img"
        aria-label="Золотая дорога"
      >
        <path
          d="M118 188 C125 158 182 149 167 124 C151 99 85 102 72 76 C60 52 104 36 122 9"
          fill="none"
          stroke="#c89c43"
          stroke-width="16"
          stroke-linecap="round"
        />

        <path
          d="M118 188 C125 158 182 149 167 124 C151 99 85 102 72 76 C60 52 104 36 122 9"
          fill="none"
          stroke="#fff3bd"
          stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="4 11"
        />
      </svg>
    </div>

    <h2 class="transition-title">
      THE ROAD OF STORIES
    </h2>

    <p class="transition-sub">
      Ваше путешествие начинается…
    </p>

  </div>
</div>

<script>
(function(){

  const layer = document.getElementById('transitionLayer');
  const links = document.querySelectorAll('[data-map-link]');

  links.forEach(function(link){

    link.addEventListener('click',function(e){

      e.preventDefault();

      const target = this.getAttribute('href');

      layer.classList.add('show');
      layer.setAttribute('aria-hidden','false');

      window.setTimeout(function(){
        window.location.href = target;
      },1800);

    });

  });

})();
</script>

</body>
</html>
