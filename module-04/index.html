   ['scroll','18%','74%','48%','15%','song','Hear the Song'],
   ['scroll','67%','74%','31%','15%','share','Share Your Thoughts'],
  ]
 };
 const make=z=>{
   if(z[0]==='map') return `<button class="template-hotspot" style="left:${z[1]};top:${z[2]};width:${z[3]};height:${z[4]};" data-action="map" aria-label="${z[6]||z[5]}"></button>`;
   if(z[0]==='play') return `<button class="template-hotspot" style="left:${z[1]};top:${z[2]};width:${z[3]};height:${z[4]};" data-play="${z[5]}" aria-label="${z[6]}"></button>`;
   if(z[0]==='voice-read') return `<button type="button" class="template-hotspot voice-hotspot" style="left:${z[2]};top:${z[3]};width:${z[4]};height:${z[5]};" data-voice-read="${z[1]}" aria-label="${z[6]}" onclick="window.openVoiceRead('${z[1]}'); return false;"></button>`;
   if(z[0]==='voice-listen') return `<button type="button" class="template-hotspot voice-hotspot" style="left:${z[2]};top:${z[3]};width:${z[4]};height:${z[5]};" data-voice-listen="${z[1]}" aria-label="${z[6]}" onclick="window.openVoiceListen('${z[1]}'); return false;"></button>`;
   return `<button class="template-hotspot" style="left:${z[1]};top:${z[2]};width:${z[3]};height:${z[4]};" data-scroll="${z[5]}" aria-label="${z[6]}"></button>`;
 };
 const voiceButtons = type==='taiga' ? voices.map((v,i)=>{const cols=[4.0,20.0,36.5,52.5,68.5,84.5]; return `<button type="button" class="template-hotspot voice-hotspot" style="left:${cols[i]}%;top:59%;width:12%;height:2.7%;z-index:1000" aria-label="Read ${esc(v[1])}" onclick="window.openVoiceRead('${v[0]}');return false;"></button><button type="button" class="template-hotspot voice-hotspot" style="left:${cols[i]}%;top:62%;width:12%;height:2.7%;z-index:1000" aria-label="Listen ${esc(v[1])}" onclick="window.openVoiceListen('${v[0]}');return false;"></button>`}).join('') : '';
 return `<section class="template-stage"><img src="${src}" alt="Approved visual template">${zones[type].map(make).join('')}${voiceButtons}</section>`
}

function map(){app.innerHTML=`<section class="map-wrap"><div class="map-intro"><div class="eyebrow">YOUR JOURNEY</div><h1>BAIKAL → FOREST → TAIGA</h1><p>Three texts. Three levels. One journey from legend to encounter to voice.</p></div><div class="map-grid"><article class="map-card blue"><div class="map-number">01</div><h2>The Old Man of Baikal</h2><p>Love becomes a place.</p><button data-action="story" data-id="baikal">ENTER BAIKAL →</button></article><article class="map-card green"><div class="map-number">02</div><h2>The Hermit’s Gift</h2><p>Kindness can change a life.</p><button data-action="story" data-id="hermit">ENTER THE FOREST →</button></article><article class="map-card pine"><div class="map-number">03</div><h2>Words from the Taiga</h2><p>Six voices. One forest.</p><button data-action="story" data-id="taiga">ENTER THE TAIGA →</button></article></div></section>`; window.scrollTo(0,0)}
function shell(body){app.innerHTML=body;window.scrollTo({top:0,behavior:'smooth'})}
function commonLead(items){return `<section class="container"><div class="section-head"><div class="eyebrow">BEFORE YOU READ</div><h2>Think. Remember. Imagine.</h2></div><div class="lead-grid">${items.map((x,i)=>`<div class="lead-card"><span>${String(i+1).padStart(2,'0')}</span><p>${esc(x)}</p></div>`).join('')}</div></section>`}
function taskPanel(title,items,kind='') {const id=(kind||title.toLowerCase().replace(/[^a-z0-9]+/g,'-')).replace(/^-|-$/g,''); return `<section id="${id}" class="container"><details class="collapsible-panel"><summary><span class="collapsible-title">${esc(title)}</span><span class="collapsible-chevron">⌄</span></summary><div class="panel ${kind} collapsible-body">${taskList(items)}</div></details></section>`}
function pairedLyrics(lyrics,translation){const n=Math.max(lyrics.length,translation.length);return `<div class="paired-lyrics"><div class="paired-head"><div>ENGLISH</div><div>РУССКИЙ</div></div>${Array.from({length:n},(_,i)=>`<div class="paired-row"><div>${esc(lyrics[i]||'')}</div><div>${esc(translation[i]||'')}</div></div>`).join('')}</div>`}
function songPanel(id,title,intro,audios,lyrics,translation,extra=''){return `<section id="${id}" class="container"><div class="music-panel song-polished"><div><div class="panel-title">${esc(title)}</div><p>${esc(intro)}</p>${audios}</div><div class="music-actions"><details class="song-lyrics-translation"><summary><span>♫ LYRICS &amp; TRANSLATION</span><span class="collapsible-chevron">⌄</span></summary>${pairedLyrics(lyrics,translation)}</details>${extra}</div></div></section>`}
function baikalPage(){shell(templateHero('baikal')+`<div class="template-note">The approved visual template is shown above. Interactive reading, audio, tasks and creation tools continue below.</div>`+`<section id="journey" class="journey-line container"><b>● READ</b><span>→</span><b>○ LISTEN</b><span>→</span><b>○ CREATE</b></section>`+`<section id="listen" class="container"><div class="media-banner"><div><div class="eyebrow">LISTEN BEFORE YOU READ</div><h2>Text 4.A · Audio Reading</h2><p>The complete legend, read in English.</p></div>${audio('audio/baikal-reading.mp3','THE OLD MAN OF BAIKAL · READING','2:13')}</div></section>`+commonLead(baikal.lead)+`<section id="read" class="container"><div class="reading-layout"><article class="reading panel"><div class="panel-title">READ THE LEGEND</div>${lines(baikal.text)}</article><aside id="glossary" class="glossary panel"><div class="panel-title">GLOSSARY · ${baikal.glossary.length} WORDS</div>${glossary(baikal.glossary)}</aside></div></section>`+sectionCards()+taskPanel('FOR THE HEART AND MIND · COMPREHENSION',baikal.heart)+taskPanel('THINK & ANALYSE',baikal.think,'think-panel')+taskPanel('DISCUSS & RELATE',baikal.discuss,'discuss-panel')+taskPanel('FOR LANGUAGE SKILLS',baikal.language,'language-panel')+taskPanel('BRAIN WORKOUT',baikal.brain,'brain-panel')+taskPanel('BEYOND THE TEXT · CHOOSE ONE',baikal.beyond,'beyond-panel')+`<section id="video" class="container"><div class="video-panel"><div class="panel-title">SEE THE STORY · BAIKAL</div><p>Watch a short visual journey into the world of Lake Baikal before you enter the legend in music.</p><video controls preload="metadata" src="video/baikal.mp4"></video><small>Baikal · visual atmosphere</small></div></section>`+songPanel('song','THE LEGEND LIVES IN MUSIC',baikal.song.title,audio('audio/baikal-song.mp3','THE OLD MAN’S TEARS','5:07 · song')+audio('audio/wind-vargan.mp3','ВЕТЕР И ВАРГАН','2:23 · instrumental'),baikal.song.lyrics,baikal.song.translation)+taskPanel('THE LEGEND LIVES IN MUSIC · SONG TASKS',baikalSongTasks,'song-task-panel')+`<section class="container"><div class="note-card"><strong>Journey note:</strong> Read, listen, reflect, then create. Song lyrics and Russian translation are presented together for easy comparison.</div><button id="next4b" class="next-button" data-action="story" data-id="hermit">CONTINUE TO THE HERMIT’S GIFT →</button></section>`)}

function hermitPage(){shell(templateHero('hermit')+commonLead(hermit.lead)+`<section id="listen" class="container"><div class="media-banner"><div><div class="eyebrow">LISTEN BEFORE YOU READ</div><h2>Text 4.B · Audio Reading</h2><p>The separate reading track is used here — not one of the song versions.</p></div>${audio('audio/hermit-reading.mp3','THE HERMIT’S GIFT · READING','voice recording')}</div></section>`+`<section id="read" class="container"><div class="reading-layout"><article class="reading panel"><div class="panel-title">READ THE STORY</div>${lines(hermit.text)}</article><aside id="place" class="side-stack"><div class="panel"><img class="side-image zoom-ready" src="assets/agafya-journalist.png"><p class="caption">A moment of encounter.</p></div><div class="panel"><div class="panel-title">THE REAL PLACE</div><img class="side-image zoom-ready" src="assets/agafya-home.jpg"><p class="caption">Agafia’s home in the taiga.</p></div></aside></div></section>`+`<section id="glossary" class="container"><details class="collapsible-panel"><summary><span class="collapsible-title">GLOSSARY · ${hermit.glossary.length} WORDS</span><span class="collapsible-chevron">⌄</span></summary><div class="panel glossary collapsible-body">${glossary(hermit.glossary)}</div></details></section>`+taskPanel('FOR THE HEART AND MIND · COMPREHENSION',hermit.heart,'hermit-heart')+taskPanel('THINK & ANALYSE',hermit.think,'hermit-think')+taskPanel('DISCUSS & RELATE',hermit.discuss,'hermit-discuss')+taskPanel('FOR LANGUAGE SKILLS',hermit.language,'hermit-language')+taskPanel('BRAIN WORKOUT',hermit.brain,'hermit-brain')+`<section id="video" class="container"><div class="video-panel"><div class="panel-title">SEE THE STORY · THE HERMIT’S GIFT</div><video controls preload="metadata" src="video/hermits-gift.mp4"></video><small>Video: The Hermit’s Gift</small></div></section>`+`<section id="song" class="container"><div class="song-workspace song-polished"><div class="panel-title">THE HERMIT’S GIFT · TWO SONG VERSIONS</div><p>Choose a version, then open the single <b>LYRICS &amp; TRANSLATION</b> panel to read and compare both languages side by side.</p><div class="song-grid">${audio('audio/hermit-song-a.mp3','VERSION 1','2:38')}${audio('audio/hermit-song-b.mp3','VERSION 2','1:57')}</div><details class="song-lyrics-translation"><summary><span>♫ LYRICS &amp; TRANSLATION</span><span class="collapsible-chevron">⌄</span></summary>${pairedLyrics(hermit.song.lyrics,hermit.song.translation)}</details></div></section>`+taskPanel('FOR THE HEART AND MIND · SONG TASKS',['What images appeared in your mind while listening?','How did the music make you feel?','Why do you think the song begins with sounds of nature, not with music?','What does “enough” mean in this song?','Why do people often look for drama and pain in stories? What is the value of silence instead?','What would you add to Agafia’s list: a little food, a little warmth, a little light, and someone to love?','Why do you think “That is enough” is repeated?'])+taskPanel('FOR LANGUAGE SKILLS · SONG', ['Match: ambience — a) to become weaker; silence — b) complete quiet; warmth — c) gentle heat; to lack — d) to be without something needed; to fade — e) atmosphere of a place. Write the correct letter after each word.','Complete: “I am just here” means Agafia is not trying to be anyone else. She is ______.','Complete: “But I gave you silence” means she offered something more valuable than ______.','Rewrite using “I don’t need… I need…”: I don’t need a lot of money. I need ______.','Rewrite using “I don’t need… I need…”: I don’t need expensive clothes. I need ______.','Nature soundscape: list five sounds you would hear in Agafia’s forest and describe the feeling each sound creates.'])+taskPanel('BEYOND THE TEXT · CHOOSE ONE',hermit.beyond,'beyond-panel')+`<section id="share" class="container"><div class="panel share"><div class="panel-title">SHARE YOUR THOUGHTS</div><p>What is “enough” for you? Write or record your answer.</p><textarea id="hermitReflection" placeholder="Write your reflection..."></textarea></div></section>`+`<section class="container"><div class="journey-nav"><button id="back4a" class="next-button secondary" data-action="story" data-id="baikal">← BACK TO THE OLD MAN OF BAIKAL</button><button id="next4c" class="next-button" data-action="story" data-id="taiga">NEXT · WORDS FROM THE TAIGA →</button></div></section>`)}
function taigaPage(){
 shell(templateHero('taiga')+`<div id="journey"></div>`+commonLead(taiga.lead)
 +songPanel('song','HEAR THE SONG','The Hermit’s Gift / That Is Enough',audio('audio/hermit-song-a.mp3','THE HERMIT’S GIFT · THAT IS ENOUGH','2:38 · song'),hermit.song.lyrics,hermit.song.translation)
 +taskPanel('HEAR THE SONG · SONG TASKS',taigaSongTasks,'song-task-panel')
 +taskPanel('FOR THE HEART AND MIND · COMPREHENSION',taiga.heart,'for-the-heart-and-mind-comprehension')
 +taskPanel('THINK & ANALYSE',taiga.think,'think-panel')
 +taskPanel('DISCUSS & RELATE',taiga.discuss,'discuss-panel')
 +taskPanel('FOR LANGUAGE SKILLS',taiga.language,'language-panel')
 +taskPanel('BRAIN WORKOUT',taiga.brain,'brain-panel')
 +taskPanel('BEYOND THE TEXT · CHOOSE ONE',taiga.beyond,'beyond-panel')
 +`<section id="video" class="container"><div class="video-panel"><div class="panel-title">SEE THE PLACE · AGAFYA’S TAIGA</div><p>Watch the taiga that became Agafia’s home and listen to the silence of the place.</p><video controls preload="metadata" src="video/that-is-enough.mp4"></video><small>Video: That Is Enough</small></div></section>` +`<section id="share" class="container"><div class="panel share"><div class="panel-title">SHARE YOUR THOUGHTS</div><p>What stays with you after reading? What did you feel, learn or understand?</p><textarea id="reflection" placeholder="Write your reflection..."></textarea><button class="save" id="saveReflection">SAVE REFLECTION</button><div id="saved"></div></div></div></section>`
 +`<section class="container"><div class="final-panel"><div class="eyebrow">EARTH ALERT · 04</div><h2>You came looking for a story.<br>You found a silence.</h2><p>And perhaps, something of your own.</p><button class="next-button" data-action="map">RETURN TO THE JOURNEY MAP →</button></div></section>`);
 const saved=localStorage.getItem('earthAlertReflection'); if(saved && $('#reflection'))$('#reflection').value=saved;
}

function reader(id){if(id==='baikal')baikalPage();else if(id==='hermit')hermitPage();else taigaPage()}
window.openVoiceRead = function(id){
  const voice = voices.find(x=>x[0]===String(id));
  if(!voice) return;
  document.querySelector('.voice-modal')?.remove();
  document.querySelectorAll('.floating-audio').forEach(x=>x.remove());
  const m=document.createElement('div');
  m.className='voice-modal';
  m.innerHTML=`<div class=\"voice-modal-card\" role=\"dialog\" aria-modal=\"true\"><div class=\"voice-modal-head\"><h2>${esc(voice[1])}</h2><button class=\"voice-modal-close\" type=\"button\" aria-label=\"Close\">CLOSE</button></div><img class=\"voice-modal-img\" src=\"assets/${voice[4]}\" alt=\"${esc(voice[1])}\"><p><em>${esc(voice[2])}</em></p><audio controls preload=\"metadata\" src=\"${voice[3]}\"></audio><div class=\"voice-modal-text\">${lines(voice[5])}</div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',ev=>{if(ev.target===m||ev.target.closest('.voice-modal-close'))m.remove()});
};
window.openVoiceListen = function(id){
  const voice = voices.find(x=>x[0]===String(id));
  if(!voice) return;
  document.querySelectorAll('.floating-audio').forEach(x=>x.remove());
  const a=document.createElement('audio'); a.className='floating-audio'; a.controls=true; a.autoplay=true; a.src=voice[3];
  document.body.appendChild(a); a.onended=()=>a.remove();
};


function openImageZoom(src, alt=''){document.querySelector('.image-zoom-stage')?.remove();const stage=document.createElement('div');stage.className='image-zoom-stage';stage.innerHTML=`<button class="image-zoom-close" type="button">CLOSE ✕</button><img src="${src}" alt="${esc(alt)}">`;document.body.appendChild(stage);stage.addEventListener('click',ev=>{if(ev.target===stage||ev.target.closest('.image-zoom-close')||ev.target.tagName==='IMG')stage.remove()});}

document.addEventListener('click',e=>{const img=e.target.closest('img.zoom-ready');if(img){openImageZoom(img.currentSrc||img.src,img.alt);return}const p=e.target.closest('[data-play]');if(p){document.querySelectorAll('.floating-audio').forEach(x=>x.remove());const a=document.createElement('audio');a.className='floating-audio';a.controls=true;a.autoplay=true;a.src=p.dataset.play;document.body.appendChild(a);a.onended=()=>a.remove();return}const h=e.target.closest('[data-scroll]');if(h){const label=h.dataset.scroll;const map={
'Your Journey':'#journey','Before You Read':'#journey','Read the Legend':'#read','Glossary':'#glossary','For the Heart and Mind':'#read','For Language Skills':'#read','Brain Workout':'#read','Beyond the Text / Music':'#song',
'Listen Before You Read':'#listen','Read the Legend':'#read','Read the Text':'#read','The Real Place':'#place','See the Story':'#video','Hear the Song':'#song','Share Your Thoughts':'#share','Back to 4.A':'#back4a','Next to 4.C':'#next4c',
'Listen to the Taiga / Wind and Vargan':'#listen','Learning Tools':'#for-the-heart-and-mind-comprehension','See the Place':'#share','Listen Again / Wind and Vargan':'#music','After You Read':'#for-the-heart-and-mind-comprehension','For the Heart and Mind':'#for-the-heart-and-mind-comprehension','For Language Skills':'#for-language-skills','Brain Workout':'#brain-workout','Beyond the Text':'#beyond-the-text-choose-one','Glossary':'#share','Your Journey':'#journey'};const el=document.querySelector(map[label]||('#'+label));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
const b=e.target.closest('[data-action]');if(b){if(b.dataset.action==='map')map();else if(b.dataset.action==='story')reader(b.dataset.id);return}const r=e.target.closest('.readBtn');if(r){$('#text-'+r.dataset.target)?.classList.toggle('open');return}const l=e.target.closest('.listenBtn');if(l){document.querySelectorAll('.floating-audio').forEach(x=>x.remove());const a=document.createElement('audio');a.className='floating-audio';a.controls=true;a.autoplay=true;a.src=l.dataset.audio;document.body.appendChild(a);a.onended=()=>a.remove();return}if(e.target.id==='saveReflection'){const v=$('#reflection').value.trim();localStorage.setItem('earthAlertReflection',v);$('#saved').textContent=v?'Saved in this browser.':''}});
map();

} catch (err) {
  document.getElementById('app').innerHTML = '<div style="padding:40px;font-family:system-ui;color:#8b2f2f"><h2>Module could not start</h2><p>' + String(err) + '</p></div>';
  console.error(err);
}
</script></body></html>
